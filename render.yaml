services:
  - type: web
    name: tyvon
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && npm ci && npm run test:frontend && pytest -q && npm run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 90 wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_BASE_URL
        sync: false
